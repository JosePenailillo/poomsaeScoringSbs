<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poomsae Scoring - Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f0f0f0;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-bottom: 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .container-main {
            display: flex;
            flex-direction: row;
            height: 100vh;
            padding: 0;
            margin: 0;
            width: 100%;
        }

        /* PANEL ROJO */
        .panel-red {
            flex: 1;
            background: #ffe0e0;
            display: flex;
            flex-direction: column;
            border-right: 3px solid #dc3545;
            overflow-y: auto;
            padding: 10px;
        }

        /* PANEL AZUL */
        .panel-blue {
            flex: 1;
            background: #e0e7ff;
            display: flex;
            flex-direction: column;
            padding: 10px;
            overflow-y: auto;
        }

        .panel-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            padding: 5px 0;
            border-bottom: 2px solid;
        }

        .panel-title.red {
            color: #dc3545;
            border-color: #dc3545;
        }

        .panel-title.blue {
            color: #0d6efd;
            border-color: #0d6efd;
        }

        .score-section {
            text-align: center;
            margin-bottom: 10px;
            padding: 8px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .score-label {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            color: #666;
        }

        .score-value {
            font-size: 28px;
            font-weight: bold;
            margin: 5px 0;
        }

        .score-red {
            color: #dc3545;
        }

        .score-blue {
            color: #0d6efd;
        }

        /* BOTONES DE PENALIZACIÓN */
        .penalty-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 10px;
            margin-top: 0;
        }

        .btn-penalty {
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .btn-penalty:active {
            transform: scale(0.95);
        }

        .btn-penalty-red {
            background: #dc3545;
        }

        .btn-penalty-blue {
            background: #0d6efd;
        }

        .btn-penalty-plus {
            background: #28a745;
        }

        .btn-penalty:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        /* PRESENTATION SECTION */
        .presentation-section {
            background: white;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .presentation-title {
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 8px;
            padding-bottom: 5px;
            border-bottom: 1px solid #ddd;
        }

        .presentation-red .presentation-title {
            color: #dc3545;
        }

        .presentation-blue .presentation-title {
            color: #0d6efd;
        }

        .criteria-group {
            margin-bottom: 8px;
        }

        .criteria-name {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #333;
        }

        .btn-score-group {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            justify-content: center;
        }

        .btn-score {
            padding: 5px 8px;
            font-size: 10px;
            font-weight: bold;
            border: 1px solid #ddd;
            background: white;
            color: #333;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 0 0 calc(20% - 3px);
        }

        .btn-score:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .btn-score.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
            font-weight: bold;
        }

        .btn-score.excellent {
            border-color: #28a745;
        }

        .btn-score.good {
            border-color: #ffc107;
        }

        .btn-score.acceptable {
            border-color: #17a2b8;
        }

        .btn-score.poor {
            border-color: #dc3545;
        }

        .collapse-button {
            width: 100%;
            padding: 8px;
            font-size: 12px;
            font-weight: bold;
            border: 2px solid;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 8px;
        }

        .collapse-button.red {
            border-color: #dc3545;
            color: #dc3545;
        }

        .collapse-button.blue {
            border-color: #0d6efd;
            color: #0d6efd;
        }

        .collapse-button:hover {
            background: #f0f0f0;
        }

        .collapse-button.collapsed::after {
            content: " ▼";
        }

        .collapse-button:not(.collapsed)::after {
            content: " ▲";
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .container-main {
                flex-direction: row;
            }

            .panel-red, .panel-blue {
                padding: 8px;
            }

            .btn-score {
                flex: 0 0 calc(25% - 2px);
                font-size: 9px;
                padding: 4px 6px;
            }

            .score-value {
                font-size: 24px;
            }

            .panel-title {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .btn-score {
                flex: 0 0 calc(33% - 2px);
                font-size: 8px;
                padding: 3px 4px;
            }

            .score-value {
                font-size: 20px;
            }

            .panel-title {
                font-size: 12px;
            }

            .btn-penalty {
                padding: 10px;
                font-size: 14px;
            }
        }

        .demo-notice {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: #e7f3ff;
            border: 2px solid #0d6efd;
            padding: 8px;
            border-radius: 5px;
            font-size: 11px;
            color: #0d6efd;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .collapse-content {
            max-height: 1000px;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .collapse-content.hidden {
            max-height: 0;
        }
    </style>
</head>

    <script>
        // Variables de estado
        let scores = {
            red: { accuracy: 4.0, fuerza: 2.0, ritmo: 2.0, energia: 2.0 },
            blue: { accuracy: 4.0, fuerza: 2.0, ritmo: 2.0, energia: 2.0 }
        };

        // Cargar datos guardados
        function loadScores() {
            const saved = localStorage.getItem('poomsae_scores');
            if (saved) {
                scores = JSON.parse(saved);
                updateDisplay();
            }
        }

        // Guardar datos
        function saveScores() {
            localStorage.setItem('poomsae_scores', JSON.stringify(scores));
            alert('✅ Puntuación guardada');
        }

        // Aplicar penalizaciones
        function applyPenalty(competitor, change) {
            let newValue = scores[competitor].accuracy + change;
            newValue = Math.max(0, Math.min(4.0, newValue));
            scores[competitor].accuracy = Math.round(newValue * 10) / 10;
            updateDisplay();
            saveScores();
        }

        // Actualizar puntuación
        function updateScore(item, competitor, value, button) {
            scores[competitor][item] = value;
            
            // Actualizar estilos de botones
            const container = document.getElementById(`${competitor}-${item}`);
            const buttons = container.querySelectorAll('.btn-score');
            buttons.forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            
            updateDisplay();
            saveScores();
        }

        // Actualizar pantalla
        function updateDisplay() {
            // Accuracy
            document.getElementById('accuracy-red').textContent = scores.red.accuracy.toFixed(1);
            document.getElementById('accuracy-blue').textContent = scores.blue.accuracy.toFixed(1);

            // Presentation (suma de 3 criterios)
            const presRed = scores.red.fuerza + scores.red.ritmo + scores.red.energia;
            const presBlue = scores.blue.fuerza + scores.blue.ritmo + scores.blue.energia;
            
            document.getElementById('presentation-red').textContent = presRed.toFixed(1);
            document.getElementById('presentation-blue').textContent = presBlue.toFixed(1);
        }

        // Toggle collapse
        function toggleCollapse(elementId, button) {
            const content = document.getElementById(elementId);
            button.classList.toggle('collapsed');
            content.classList.toggle('hidden');
        }

        // Inicializar
        loadScores();
        updateDisplay();

        // Cerrar secciones por defecto
        document.getElementById('red-presentation').classList.add('hidden');
        document.getElementById('blue-presentation').classList.add('hidden');
        document.querySelector('.collapse-button.red').classList.add('collapsed');
        document.querySelector('.collapse-button.blue').classList.add('collapsed');
    </script>
</body>
</html>
