        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script>
        //Sección notas en pulsador
        let scores = { red: 4.0, blue: 4.0 };
        let penalties = { red: 0, blue: 0 };
        
        let presentation = { red: 0, blue: 0 };
        let fuerzaBlue = 2.0;
        let fuerzaRed = 2.0;
        let ritmoBlue = 2.0;
        let ritmoRed = 2.0;
        let energiaBlue = 2.0;
        let energiaRed = 2.0;
        

        function applyPenalty(competitor, change) {
        if (change > 0 && scores[competitor] >= 4.0) {
            scores[competitor] = Math.max(0, Math.min(4.0, scores[competitor] + change));
            updateDisplay();
            alert("No se puede sumar más de 4.0 en el puntaje.");
            return;
        }
        if (change < 0 && scores[competitor] <= 0) {
            scores[competitor] = Math.max(0, Math.min(4.0, scores[competitor] + change));
            updateDisplay();
            alert("No se puede restar más de 0 en el puntaje.");
            return;
        }
        if (penalties[competitor] + Math.abs(change)) {
            penalties[competitor] += Math.abs(change);
            scores[competitor] = Math.max(0, Math.min(4.0, scores[competitor] + change));
            updateDisplay();
        } else {
            alert("No se puede aplicar más de 4.0 de descuento.");
        }
    }
        function updateScore(item, competitor, value) {
            if(item == 'fuerza' & competitor == 'blue') {
                presentation[item, competitor] = value;
                fuerzaBlue=value} 
                else if(item == 'fuerza' & competitor == 'red'){
                    presentation[item, competitor] = value;
                    fuerzaRed=value};
            
            if(item == 'ritmo' & competitor == 'blue') {
                presentation[item, competitor] = value;
                ritmoBlue=value} 
                else if(item == 'ritmo' & competitor == 'red'){
                    presentation[item, competitor] = value;
                    ritmoRed=value};

            if(item == 'energia' & competitor == 'blue') {
                presentation[item, competitor] = value;
                energiaBlue=value} 
                else if(item == 'energia' & competitor == 'red'){
                    presentation[item, competitor] = value;
                    energiaRed=value};
            
                    
            updateDisplay();
        }

        function updateDisplay() {
            let totalPreBlue = 0;
            let totalPreRed = 0;
            totalPreBlue = fuerzaBlue + ritmoBlue + energiaBlue;
            totalPreRed = fuerzaRed + ritmoRed + energiaRed;
            totalRed = scores.red + totalPreRed;
            totalBlue = scores.blue + totalPreBlue;
            // Mostrar el puntaje actualizado
            let redText = `<span class="text-danger">Acc: ${scores.red.toFixed(1)}</span> <span class="text-danger">Pre: ${totalPreRed.toFixed(1)}</span> <span class="text-danger">Total: </span><span class="text-dark" style="font-weight:bold">${totalRed.toFixed(1)}</span>`;
            let blueText = `<span class="text-primary">Acc: ${scores.blue.toFixed(1)}</span> <span class="text-primary">Pre: ${totalPreBlue.toFixed(1)}</span> <span class="text-primary">Total: </span><span class="text-dark" style="font-weight:bold">${totalBlue.toFixed(1)}</span>`;

            document.getElementById('score-display').innerHTML = `${redText} - ${blueText}`;
        }
        // Llamar a la función al inicio para reflejar los valores iniciales
        updateDisplay();

        function changeColor1(clickedButton) {

            let buttons = document.querySelectorAll('#red-1 button');

            clickedButton.classList.add('active');
        }

        //Finaliza sección notas en pulsador


        function getCSRFToken() {
            return document.querySelector('[name=csrfmiddlewaretoken]').value;
        }

        function sendScores() {
            let totalPreBlue = 0;
            let totalPreRed = 0;
            totalPreBlue = fuerzaBlue + ritmoBlue + energiaBlue;
            totalPreRed = fuerzaRed + ritmoRed + energiaRed;
            totalRed = scores.red + totalPreRed;
            totalBlue = scores.blue + totalPreBlue;
            let score = {
                red: {
                    acc: scores.red.toFixed(1) || 0,
                    pre: totalPreRed.toFixed(1) || 0
                },
                blue: {
                    acc: scores.blue.toFixed(1) || 0,
                    pre: totalPreBlue.toFixed(1) || 0
                }
            };

        fetch("/enviar_notas/", { // URL del backend
                method: 'POST',
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCSRFToken()  // Agrega el token CSRF en el header
                },
                body: JSON.stringify(score)
            })
        fetch("/evaluar/enviar/", { // URL del backend
                method: 'POST',
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCSRFToken()  // Agrega el token CSRF en el header
                },
                body: JSON.stringify(score)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                alert(data.message);
                window.location.reload();
            })
            .catch(error => {
                console.error("Error al enviar las notas:", error);
                alert("Error al enviar las notas");
            });
        }
